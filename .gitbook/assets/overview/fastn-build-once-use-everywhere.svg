<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 496" width="680" height="496" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Build once, extend per customer, use everywhere</title>
<desc id="d">You build an integration once, from the fastn dashboard, from your AI tool through the fastn MCP server, or with the fastn agent. Each customer uses it as is or extends it, and their changes stay with that customer. The same integration is used in your product through the widget and API, and by your AI agents through the MCP gateway. fastn runs and maintains it against each customer's apps.</desc>
<style>
:root{--bg:#ffffff;--fg:#17171f;--mut:#5e5e72;--line:#c9c9d6;
--team:#5b4cf0;--teamc:#efedff;--cust:#0e8f7e;--custc:#e3f6f3;--fastn:#3c3c52;--fastnc:#ececf3}
@media (prefers-color-scheme:dark){:root{--bg:#121218;--fg:#ececf2;--mut:#9d9db0;--line:#3a3a48;
--team:#9a8fff;--teamc:#26224a;--cust:#45d1bd;--custc:#12312d;--fastn:#c7c7d8;--fastnc:#24242f}}
.bg{fill:var(--bg)}
.h{fill:var(--fg);font-size:14px;font-weight:600}
.s{fill:var(--mut);font-size:12px}
.b{fill:var(--fg);font-size:13px}
.team{fill:var(--teamc);stroke:var(--team);stroke-width:1}
.cust{fill:var(--custc);stroke:var(--cust);stroke-width:1}
.fastn{fill:var(--fastnc);stroke:var(--fastn);stroke-width:1}
.frame{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:4 4}
.arr{stroke:var(--mut);stroke-width:1.4;fill:none}
.ah{fill:var(--mut)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="680" height="496" rx="12"/>
<g text-anchor="middle" dominant-baseline="central">
<text class="h" x="102" y="40">Build once</text>
<text class="h" x="330" y="40">Extend per customer</text>
<text class="h" x="557" y="40">Use everywhere</text>

<rect class="team" x="20" y="70" width="165" height="56" rx="8"/>
<text class="h" x="102" y="89">Dashboard</text><text class="s" x="102" y="108">app.fastn.dev</text>
<rect class="team" x="20" y="150" width="165" height="56" rx="8"/>
<text class="h" x="102" y="169">Your AI tool</text><text class="s" x="102" y="188">fastn MCP server</text>
<rect class="team" x="20" y="230" width="165" height="56" rx="8"/>
<text class="h" x="102" y="249">fastn agent</text><text class="s" x="102" y="268">Build with AI</text>
<line class="arr" x1="185" y1="98" x2="216" y2="98" marker-end="url(#a)"/>
<line class="arr" x1="185" y1="178" x2="216" y2="178" marker-end="url(#a)"/>
<line class="arr" x1="185" y1="258" x2="216" y2="258" marker-end="url(#a)"/>

<rect class="frame" x="220" y="70" width="220" height="216" rx="12"/>
<text class="h" x="330" y="92">Your integration</text>
<rect class="fastn" x="240" y="112" width="180" height="36" rx="6"/>
<text class="b" x="330" y="130">Customer A: as is</text>
<rect class="cust" x="240" y="158" width="180" height="36" rx="6"/>
<text class="b" x="330" y="176">Customer B: extended</text>
<rect class="cust" x="240" y="204" width="180" height="36" rx="6"/>
<text class="b" x="330" y="222">Customer C: extended</text>
<text class="s" x="330" y="264">Changes stay per customer</text>

<line class="arr" x1="440" y1="138" x2="471" y2="138" marker-end="url(#a)"/>
<line class="arr" x1="440" y1="238" x2="471" y2="238" marker-end="url(#a)"/>
<rect class="team" x="475" y="110" width="165" height="56" rx="8"/>
<text class="h" x="557" y="129">Your product</text><text class="s" x="557" y="148">Widget and API</text>
<rect class="team" x="475" y="210" width="165" height="56" rx="8"/>
<text class="h" x="557" y="229">Your AI agents</text><text class="s" x="557" y="248">MCP gateway</text>

<line class="arr" x1="330" y1="286" x2="330" y2="316" marker-end="url(#a)"/>
<rect class="fastn" x="220" y="320" width="220" height="56" rx="8"/>
<text class="h" x="330" y="339">Runs and maintains</text><text class="s" x="330" y="358">Logs, alerts, API fixes</text>
<line class="arr" x1="330" y1="376" x2="330" y2="406" marker-end="url(#a)"/>
<rect class="fastn" x="220" y="410" width="220" height="56" rx="8"/>
<text class="h" x="330" y="429">Each customer's apps</text><text class="s" x="330" y="448">HubSpot, Slack, Jira</text>
</g>
</svg>
