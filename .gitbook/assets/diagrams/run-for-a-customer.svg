<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 366" width="680" height="366" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Running an integration for one customer</title>
<desc id="d">Your backend calls a workflow or a webhook trigger and names the customer with x-org-id. fastn loads that customer's setup, calls their apps with their connections, and returns the result inline or an execution id to poll.</desc>
<style>
:root{--bg:#ffffff;--fg:#17171f;--mut:#5e5e72;--line:#c9c9d6;
--team:#5b4cf0;--teamc:#efedff;--cust:#0e8f7e;--custc:#e3f6f3;--fastn:#3c3c52;--fastnc:#ececf3}
@media (prefers-color-scheme:dark){:root{--bg:#121218;--fg:#ececf2;--mut:#9d9db0;--line:#3a3a48;
--team:#9a8fff;--teamc:#26224a;--cust:#45d1bd;--custc:#12312d;--fastn:#c7c7d8;--fastnc:#24242f}}
.bg{fill:var(--bg)}
.h{fill:var(--fg);font-size:14px;font-weight:600}
.s{fill:var(--mut);font-size:12px}
.l{fill:var(--fg);font-size:12px}
.team{fill:var(--teamc);stroke:var(--team);stroke-width:1}
.cust{fill:var(--custc);stroke:var(--cust);stroke-width:1}
.fastn{fill:var(--fastnc);stroke:var(--fastn);stroke-width:1}
.frame{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:4 4}
.life{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.arr{stroke:var(--mut);stroke-width:1.4;fill:none}
.ah{fill:var(--mut)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="680" height="366" rx="12"/>
<g text-anchor="middle" dominant-baseline="central">
<rect class="team" x="51.66666666666667" y="20" width="150" height="44" rx="8"/>
<text class="h" x="126.66666666666667" y="42.0">Your backend</text>
<line class="life" x1="126.66666666666667" y1="64" x2="126.66666666666667" y2="346"/>
<rect class="fastn" x="265.0" y="20" width="150" height="44" rx="8"/>
<text class="h" x="340.0" y="42.0">fastn</text>
<line class="life" x1="340.0" y1="64" x2="340.0" y2="346"/>
<rect class="cust" x="478.33333333333337" y="20" width="150" height="44" rx="8"/>
<text class="h" x="553.3333333333334" y="42.0">Customer's apps</text>
<line class="life" x1="553.3333333333334" y1="64" x2="553.3333333333334" y2="346"/>
<text class="l" x="233.33333333333334" y="96">1. Run, with x-org-id</text>
<line class="arr" x1="130.66666666666669" y1="112" x2="334.0" y2="112" marker-end="url(#a)"/>
<rect class="fastn" x="245.0" y="145" width="190" height="30" rx="6"/>
<text class="l" x="340.0" y="160">2. Load customer's setup</text>
<text class="l" x="446.6666666666667" y="200">3. Call their apps</text>
<line class="arr" x1="344.0" y1="216" x2="547.3333333333334" y2="216" marker-end="url(#a)"/>
<text class="l" x="446.6666666666667" y="252">4. Data</text>
<line class="arr" x1="549.3333333333334" y1="268" x2="346.0" y2="268" marker-end="url(#a)"/>
<text class="l" x="233.33333333333334" y="304">5. Result, or execution id</text>
<line class="arr" x1="336.0" y1="320" x2="132.66666666666669" y2="320" marker-end="url(#a)"/>
</g>
</svg>
