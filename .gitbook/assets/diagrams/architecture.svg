<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 462" width="680" height="462" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">fastn architecture</title>
<desc id="d">Your team builds in the fastn dashboard or from an AI tool through the fastn MCP server. Your backend holds the API key and uses the API and SDK to get embed tokens and start runs. Your customer uses the widget inside your product to connect apps, which stores a connection per customer. Integrations hold connectors, workflows and triggers; the workflow runtime runs them once per customer with that customer's connections. The maintainer agent watches apps and proposes fixes, fastn Connect gives your AI agents each customer's apps as tools, and Health and Logs record every run and event. All calls reach the customers' apps with that customer's sign-in.</desc>
<style>
:root{--bg:#ffffff;--fg:#17171f;--mut:#5e5e72;--line:#c9c9d6;
--team:#5b4cf0;--teamc:#efedff;--cust:#0e8f7e;--custc:#e3f6f3;--fastn:#3c3c52;--fastnc:#ececf3}
@media (prefers-color-scheme:dark){:root{--bg:#121218;--fg:#ececf2;--mut:#9d9db0;--line:#3a3a48;
--team:#9a8fff;--teamc:#26224a;--cust:#45d1bd;--custc:#12312d;--fastn:#c7c7d8;--fastnc:#24242f}}
.bg{fill:var(--bg)}
.h{fill:var(--fg);font-size:14px;font-weight:600}
.s{fill:var(--mut);font-size:12px}
.l{fill:var(--fg);font-size:12px}
.team{fill:var(--teamc);stroke:var(--team);stroke-width:1}
.cust{fill:var(--custc);stroke:var(--cust);stroke-width:1}
.fastn{fill:var(--fastnc);stroke:var(--fastn);stroke-width:1}
.frame{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:4 4}
.life{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.arr{stroke:var(--mut);stroke-width:1.4;fill:none}
.ah{fill:var(--mut)}
</style>
