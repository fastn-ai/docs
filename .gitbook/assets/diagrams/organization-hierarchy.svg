<text class="l" x="533.0" y="259">User</text>
<rect style="fill:var(--bg);stroke:var(--cust)" x="565.0" y="246" width="52" height="26" rx="6"/>
<text class="l" x="591.0" y="259">User</text>
<text class="l" x="562" y="294">Connections</text>
