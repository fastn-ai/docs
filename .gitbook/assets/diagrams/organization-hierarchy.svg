<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 392" width="680" height="392" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Your organization, its customers and their end users</title>
<desc id="d">Your organization is the SaaS company that builds the integrations, with team members in roles such as Owner, Admin and Developer. Under it, each customer is its own organization with its own end users and its own connections to apps such as HubSpot, Salesforce or Jira. Customers are isolated from each other.</desc>
<style>
:root{--bg:#ffffff;--fg:#17171f;--mut:#5e5e72;--line:#c9c9d6;
--team:#5b4cf0;--teamc:#efedff;--cust:#0e8f7e;--custc:#e3f6f3;--fastn:#3c3c52;--fastnc:#ececf3}
@media (prefers-color-scheme:dark){:root{--bg:#121218;--fg:#ececf2;--mut:#9d9db0;--line:#3a3a48;
--team:#9a8fff;--teamc:#26224a;--cust:#45d1bd;--custc:#12312d;--fastn:#c7c7d8;--fastnc:#24242f}}
.bg{fill:var(--bg)}
.h{fill:var(--fg);font-size:14px;font-weight:600}
.s{fill:var(--mut);font-size:12px}
.l{fill:var(--fg);font-size:12px}
.team{fill:var(--teamc);stroke:var(--team);stroke-width:1}
.cust{fill:var(--custc);stroke:var(--cust);stroke-width:1}
.fastn{fill:var(--fastnc);stroke:var(--fastn);stroke-width:1}
.frame{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:4 4}
.life{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.arr{stroke:var(--mut);stroke-width:1.4;fill:none}
.ah{fill:var(--mut)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="680" height="392" rx="12"/>
