<text class="l" x="519.0" y="319">Zoho</text>
<rect style="fill:var(--bg);stroke:var(--cust)" x="565.0" y="306" width="80" height="26" rx="6"/>
<text class="l" x="605.0" y="319">Jira</text>
<text class="s" x="340" y="370">Each customer is isolated: its users, connections and data never reach another customer.</text>
