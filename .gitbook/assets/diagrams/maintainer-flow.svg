<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 116" width="680" height="116" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How an API change gets fixed</title>
<desc id="d">An app changes its API. The maintainer agent detects it and proposes a patch. The operator reviews it in Health, Pending updates. Once accepted, the fix applies to every customer's setup.</desc>
<style>
:root{--bg:#ffffff;--fg:#17171f;--mut:#5e5e72;--line:#c9c9d6;
--team:#5b4cf0;--teamc:#efedff;--cust:#0e8f7e;--custc:#e3f6f3;--fastn:#3c3c52;--fastnc:#ececf3}
@media (prefers-color-scheme:dark){:root{--bg:#121218;--fg:#ececf2;--mut:#9d9db0;--line:#3a3a48;
--team:#9a8fff;--teamc:#26224a;--cust:#45d1bd;--custc:#12312d;--fastn:#c7c7d8;--fastnc:#24242f}}
.bg{fill:var(--bg)}
.h{fill:var(--fg);font-size:14px;font-weight:600}
.s{fill:var(--mut);font-size:12px}
.l{fill:var(--fg);font-size:12px}
.team{fill:var(--teamc);stroke:var(--team);stroke-width:1}
.cust{fill:var(--custc);stroke:var(--cust);stroke-width:1}
.fastn{fill:var(--fastnc);stroke:var(--fastn);stroke-width:1}
.frame{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:4 4}
.life{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.arr{stroke:var(--mut);stroke-width:1.4;fill:none}
.ah{fill:var(--mut)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="680" height="116" rx="12"/>
<g text-anchor="middle" dominant-baseline="central">
<rect class="fastn" x="20" y="30" width="145" height="56" rx="8"/>
<text class="h" x="92.5" y="49.0">App changes API</text><text class="s" x="92.5" y="68.0">Vendor update</text>
<rect class="fastn" x="185" y="30" width="145" height="56" rx="8"/>
<text class="h" x="257.5" y="49.0">Maintainer agent</text><text class="s" x="257.5" y="68.0">Proposes a patch</text>
<rect class="team" x="350" y="30" width="145" height="56" rx="8"/>
<text class="h" x="422.5" y="49.0">Operator reviews</text><text class="s" x="422.5" y="68.0">Pending updates</text>
<rect class="cust" x="515" y="30" width="145" height="56" rx="8"/>
<text class="h" x="587.5" y="49.0">Fix goes live</text><text class="s" x="587.5" y="68.0">Every customer</text>
<line class="arr" x1="165" y1="58" x2="182" y2="58" marker-end="url(#a)"/>
<line class="arr" x1="330" y1="58" x2="347" y2="58" marker-end="url(#a)"/>
<line class="arr" x1="495" y1="58" x2="512" y2="58" marker-end="url(#a)"/>
</g>
</svg>
