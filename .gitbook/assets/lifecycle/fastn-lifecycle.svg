<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 908" width="1440" height="908" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The fastn integration lifecycle</title><desc id="d">Who does what at each stage, from building an integration to running it for every customer.</desc>
<style>
:root{--bg:#ffffff;--fg:#17171f;--mut:#5e5e72;--line:#e3e3ec;--lane:#f6f6fa;
--team:#5b4cf0;--teamc:#efedff;--cust:#0e8f7e;--custc:#e3f6f3;--fastn:#3c3c52;--fastnc:#ececf3;--hl:#5b4cf0}
@media (prefers-color-scheme:dark){:root{--bg:#121218;--fg:#ececf2;--mut:#9d9db0;--line:#2a2a36;--lane:#191921;
--team:#9a8fff;--teamc:#26224a;--cust:#45d1bd;--custc:#12312d;--fastn:#c7c7d8;--fastnc:#24242f;--hl:#9a8fff}}
.bg{fill:var(--bg)}.fg{fill:var(--fg)}.mut{fill:var(--mut)}.lane{fill:var(--lane)}
.team{fill:var(--team)}.cust{fill:var(--cust)}.fastn{fill:var(--fastn)}
.c-team{fill:var(--teamc);stroke:var(--team)}.c-customer{fill:var(--custc);stroke:var(--cust)}.c-fastn{fill:var(--fastnc);stroke:var(--fastn)}
.arrow{stroke:var(--mut);fill:none;stroke-width:1.6}.ah{fill:var(--mut)}
.dim{opacity:.22}.hlbox{fill:none;stroke:var(--hl);stroke-width:2.5}
</style>
<rect class="bg" width="1440" height="908" rx="16"/>
<text class="fg" x="24" y="46" font-size="26" font-weight="700">The fastn integration lifecycle</text>
<text class="mut" x="24" y="74" font-size="15">Who does what, from building an integration once to running it for every customer. Read left to right.</text>
<g>
<circle class="team" cx="270.0" cy="110" r="13"/>
<text x="270.0" y="114.5" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">1</text>
<text class="fg" x="290.0" y="108" font-size="16" font-weight="700">Build</text>
<text class="mut" x="290.0" y="127" font-size="12.5">Create the integration</text>
</g>
<path class="arrow" d="M464.8 110 H486.8"/>
<g>
<circle class="team" cx="504.8" cy="110" r="13"/>
<text x="504.8" y="114.5" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">2</text>
<text class="fg" x="524.8" y="108" font-size="16" font-weight="700">Publish</text>
<text class="mut" x="524.8" y="127" font-size="12.5">Make it a template</text>
</g>
<path class="arrow" d="M699.6 110 H721.6"/>
<g>
<circle class="team" cx="739.6" cy="110" r="13"/>
<text x="739.6" y="114.5" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">3</text>
<text class="fg" x="759.6" y="108" font-size="16" font-weight="700">Embed</text>
<text class="mut" x="759.6" y="127" font-size="12.5">Put the widget in your product</text>
</g>
<path class="arrow" d="M934.4000000000001 110 H956.4000000000001"/>
<g>
<circle class="team" cx="974.4000000000001" cy="110" r="13"/>
<text x="974.4000000000001" y="114.5" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">4</text>
<text class="fg" x="994.4000000000001" y="108" font-size="16" font-weight="700">Customize</text>
<text class="mut" x="994.4000000000001" y="127" font-size="12.5">Each customer makes it theirs</text>
</g>
<path class="arrow" d="M1169.2 110 H1191.2"/>
<g>
<circle class="team" cx="1209.2" cy="110" r="13"/>
<text x="1209.2" y="114.5" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">5</text>
<text class="fg" x="1229.2" y="108" font-size="16" font-weight="700">Run and monitor</text>
<text class="mut" x="1229.2" y="127" font-size="12.5">Keep it working</text>
</g>
<text class="team" x="24" y="142" font-size="11.5" font-weight="700" letter-spacing=".08em">YOUR TEAM (THE SAAS COMPANY)</text>
<rect class="lane" x="24" y="150" width="1392" height="96" rx="10"/>
<text class="fg" x="40" y="194.0" font-size="15" font-weight="650">Integration builder</text>
<text class="mut" x="40" y="214.0" font-size="12.5">Solutions or integration engineer</text>
<rect class="lane" x="24" y="256" width="1392" height="96" rx="10"/>
<text class="fg" x="40" y="300.0" font-size="15" font-weight="650">Product owner</text>
<text class="mut" x="40" y="320.0" font-size="12.5">Decides what customers get</text>
<rect class="lane" x="24" y="362" width="1392" height="96" rx="10"/>
<text class="fg" x="40" y="406.0" font-size="15" font-weight="650">App developer</text>
<text class="mut" x="40" y="426.0" font-size="12.5">Owns your product's code</text>
<rect class="lane" x="24" y="468" width="1392" height="96" rx="10"/>
<text class="fg" x="40" y="512.0" font-size="15" font-weight="650">Support and ops</text>
<text class="mut" x="40" y="532.0" font-size="12.5">Customer success, on-call</text>
<text class="cust" x="24" y="592" font-size="11.5" font-weight="700" letter-spacing=".08em">YOUR CUSTOMER</text>
<rect class="lane" x="24" y="600" width="1392" height="96" rx="10"/>
<text class="fg" x="40" y="644.0" font-size="15" font-weight="650">End-customer admin</text>
<text class="mut" x="40" y="664.0" font-size="12.5">Uses your product</text>
<text class="fastn" x="24" y="724" font-size="11.5" font-weight="700" letter-spacing=".08em">FASTN</text>
<rect class="lane" x="24" y="732" width="1392" height="96" rx="10"/>
<text class="fg" x="40" y="776.0" font-size="15" font-weight="650">fastn platform</text>
<text class="mut" x="40" y="796.0" font-size="12.5">Agents and runtime</text>
<g>
<rect class="c-team" x="260.0" y="160" width="210.8" height="76" rx="8" stroke-width="1.2"/>
<text class="fg" font-size="12.8"><tspan x="272.0" y="177.0">Describes the integration in</tspan><tspan x="272.0" y="194.0">plain words to fastn's agent,</tspan><tspan x="272.0" y="211.0">or from Claude or Cursor over</tspan><tspan x="272.0" y="228.0">MCP</tspan></text>
</g>
<g>
<rect class="c-team" x="494.8" y="160" width="210.8" height="76" rx="8" stroke-width="1.2"/>
<text class="fg" font-size="12.8"><tspan x="506.8" y="185.5">Reviews the test results, then</tspan><tspan x="506.8" y="202.5">saves, publishes and deploys a</tspan><tspan x="506.8" y="219.5">version</tspan></text>
</g>
<g>
<rect class="c-team" x="494.8" y="266" width="210.8" height="76" rx="8" stroke-width="1.2"/>
<text class="fg" font-size="12.8"><tspan x="506.8" y="291.5">Adds it to the widget catalog,</tspan><tspan x="506.8" y="308.5">chooses what customers may</tspan><tspan x="506.8" y="325.5">change, styles the widget</tspan></text>
</g>
<g>
<rect class="c-team" x="729.6" y="372" width="210.8" height="76" rx="8" stroke-width="1.2"/>
<text class="fg" font-size="12.8"><tspan x="741.6" y="397.5">Embeds the widget with an</tspan><tspan x="741.6" y="414.5">iframe or the SDK and issues a</tspan><tspan x="741.6" y="431.5">short-lived token per customer</tspan></text>
</g>
<g>
<rect class="c-team" x="1199.2" y="478" width="210.8" height="76" rx="8" stroke-width="1.2"/>
<text class="fg" font-size="12.8"><tspan x="1211.2" y="503.5">Watches every customer's runs</tspan><tspan x="1211.2" y="520.5">in Activity, gets alerts, finds</tspan><tspan x="1211.2" y="537.5">and fixes failures</tspan></text>
</g>
<g>
<rect class="c-customer" x="964.4000000000001" y="610" width="210.8" height="76" rx="8" stroke-width="1.2"/>
<text class="fg" font-size="12.8"><tspan x="976.4000000000001" y="627.0">Connects their own accounts,</tspan><tspan x="976.4000000000001" y="644.0">maps fields, asks the widget</tspan><tspan x="976.4000000000001" y="661.0">agent for changes or a new</tspan><tspan x="976.4000000000001" y="678.0">integration</tspan></text>
</g>
<g>
<rect class="c-customer" x="1199.2" y="610" width="210.8" height="76" rx="8" stroke-width="1.2"/>
<text class="fg" font-size="12.8"><tspan x="1211.2" y="644.0">Sees sync status and history,</tspan><tspan x="1211.2" y="661.0">and gets their own alerts</tspan></text>
</g>
<g>
<rect class="c-fastn" x="260.0" y="742" width="210.8" height="76" rx="8" stroke-width="1.2"/>
<text class="fg" font-size="12.8"><tspan x="272.0" y="767.5">Picks connectors, writes the</tspan><tspan x="272.0" y="784.5">workflow, generates and runs</tspan><tspan x="272.0" y="801.5">test cases</tspan></text>
</g>
<g>
<rect class="c-fastn" x="494.8" y="742" width="210.8" height="76" rx="8" stroke-width="1.2"/>
<text class="fg" font-size="12.8"><tspan x="506.8" y="767.5">Versions every change and</tspan><tspan x="506.8" y="784.5">promotes it across your</tspan><tspan x="506.8" y="801.5">environments</tspan></text>
</g>
<g>
<rect class="c-fastn" x="729.6" y="742" width="210.8" height="76" rx="8" stroke-width="1.2"/>
<text class="fg" font-size="12.8"><tspan x="741.6" y="776.0">Scopes every connection to the</tspan><tspan x="741.6" y="793.0">right customer</tspan></text>
</g>
<g>
<rect class="c-fastn" x="964.4000000000001" y="742" width="210.8" height="76" rx="8" stroke-width="1.2"/>
<text class="fg" font-size="12.8"><tspan x="976.4000000000001" y="767.5">Handles OAuth, tokens and</tspan><tspan x="976.4000000000001" y="784.5">credentials; builds requested</tspan><tspan x="976.4000000000001" y="801.5">changes for approval</tspan></text>
</g>
<g>
<rect class="c-fastn" x="1199.2" y="742" width="210.8" height="76" rx="8" stroke-width="1.2"/>
<text class="fg" font-size="12.8"><tspan x="1211.2" y="767.5">Runs, retries and rate-limits;</tspan><tspan x="1211.2" y="784.5">agents catch API changes and</tspan><tspan x="1211.2" y="801.5">propose fixes</tspan></text>
</g>
<path class="arrow" stroke-dasharray="5 5" d="M1304.6000000000001 834 V860 H365.4 V840"/>
<path class="ah" d="M359.4 848 L365.4 838 L371.4 848 Z"/>
<text class="mut" x="835.0" y="880" font-size="13" text-anchor="middle">New requests and changes loop back to Build. Customers can also ask the widget agent directly, and you approve what ships.</text>
</svg>