<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>fastn widget example</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; }
    header { padding: 16px 24px; border-bottom: 1px solid #ddd; }
    #integrations { height: calc(100vh - 60px); }
  </style>
</head>
<body>
  <header>Settings: Integrations</header>
  <div id="integrations"></div>
  <script>
    // Fetch a fresh token on every page load. Never hard-code one: tokens expire after 8 hours.
    fetch("/api/fastn-token")
      .then((r) => r.json())
      .then(({ token, error }) => {
        if (!token) throw new Error(error || "No token");
        const iframe = document.createElement("iframe");
        iframe.src = `https://api.fastn.dev/api/v1/embed/iframe?token=${encodeURIComponent(token)}`;
        iframe.style.cssText = "width:100%;height:100%;border:none";
        iframe.allow = "clipboard-write";
        document.getElementById("integrations").appendChild(iframe);
      })
      .catch((err) => {
        document.getElementById("integrations").textContent = "Could not load integrations: " + err.message;
      });
  </script>
</body>
</html>
